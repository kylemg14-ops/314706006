name: CI Pipeline

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. TypeScript Typecheck (20%)
      - name: TypeScript typecheck
        run: npm run typecheck

      # 2. Prettier check (20%)
      - name: Prettier check
        run: npx prettier --check .

      # 3. Test & Generate Report (20%)
      # 註：這裡假設你使用 vitest 或 jest，並輸出 junit 格式以供顯示
      - name: Run tests
        run: npm test -- --reporter=junit --outputFile=test-results.xml
        continue-on-error: true # 為了確保後續能上傳測試報告，這裡設為 true，但在最後判斷失敗

      # 4. Display test results on GitHub Actions page (20%)
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always() # 無論測試成功或失敗都要執行
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit

      # 5. Fail the pipeline if any previous step failed (20%)
      - name: Final Check
        if: steps.typecheck.outcome == 'failure' || steps.prettier.outcome == 'failure'
        run: exit 1
