name: CI Pipeline

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

permissions:
  contents: read
  checks: write 

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check .

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always() 
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit

      - name: Final Check
        if: steps.typecheck.outcome == 'failure' || steps.prettier.outcome == 'failure'
        run: exit 1
